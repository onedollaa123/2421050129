<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <script>
        document.writeln("xin chào <br> ")
    </script>
    <script src="script.js">
        </script>
    <script>
        var name ="Nhu Quynh"

        document.writeln(name);

        name = "quynh nhu"

        document.writeln(name);

        var year = 2026;

        document.writeln(year);

        var a = 10;
        var b = 10;
        var kq=0;
        kq = a+b;
        document.writeln(kq);

        var a = 10;
        var b = 10;
        var kq=0;
        kq = a-b;
        document.writeln(kq);

        var a = 10;
        var b = 10;
        var kq=0;
        kq = a*b;
        document.writeln(kq);

        var a = 10;
        var b = 10;
        var kq=0;
        kq = a/b;
        document.writeln(kq);
        var a = 10;
        var b = 10;
        var kq=0;
        kq = a%b;
        document.writeln(kq);

        //++
        document.writeln(a++);
        //++
        document.writeln(++a);
        //--
        document.writeln(a--);
        //--
        document.writeln(--a);

        a+=b;
        document.writeln(a);
        a-=b;
        document.writeln(a);

        var ho = "do";
        document.writeln( ho + name );
        document.writeln("br "+ name.length);
        document.writeln(typeof(name));

        var hovaten ="Nguyễn Huy Châu";
        document.writeln("br "+ hovaten.includes("C"))
        document.writeln("br "+ hovaten.startsWith("C"))
        //thay thế kí tự
        document.writeln("br "+ hovaten.replace("C","D"))
        document.writeln("br "+ hovaten.toUpperCase())
        document.writeln("br "+ hovaten.toLocaleLowerCase())
    </script>
</body>
</html>
