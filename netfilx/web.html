<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
        }

        header, .danh-sach-muc, .chuc-nang {
            display: flex;
            align-items: center;
        }

        header {
            justify-content: space-between;
            padding: 10px 3%;
            position: sticky;
            top: 0;
            background-color: rgba(20, 20, 20, 0.95);
            z-index: 100;
        }

        .danh-sach-muc {
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 8px;
        }

        .logo {
            width: 65px;
            margin-right: 15px;
        }

        .muc {
            padding: 8px 14px;
            border-radius: 20px;
            transition: background 0.2s;
        }

        .lien-ket-muc {
            color: #dbdbdd;
            text-decoration: none;
            font-size: 13px;
        }

        .muc:hover, .dang-chon {
            background: #4e4b52;
        }

        .muc:hover .lien-ket-muc {
            color: #ffffff;
        }

        .chuc-nang {
            gap: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        .avata {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
        }

        /* BANNER */

        .banner {
            width: 95%;
            height: 80vh;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }

        .banner-anh,
        .banner-video {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 16px;
        }

        .banner-anh {
            object-fit: cover;
            cursor: pointer;
        }

        .banner-video {
            display: none;
            border: none;
        }

        .thong-tin-phim {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 45%;
            z-index: 2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .thong-tin-phim h1 {
            font-size: 38px;
            margin: 0 0 10px 0;
        }

        .mo-ta {
            font-size: 14px;
            line-height: 1.5;
            color: #e5e5e5;
        }

        .nut-phim {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .nut-phim button {
            padding: 10px 22px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .nut-phim button:hover {
            opacity: 0.85;
        }

        .nut-phat {
            background: white;
            color: black;
        }

        .nut-thong-tin {
            background: rgba(109, 109, 110, 0.7);
            color: white;
        }

        .nut-quay-lai {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3;
            display: none;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        /* DANH SÁCH PHIM */

        .danh-sach-the-loai {
            width: 95%;
            margin: 20px auto;
        }

        .ten-the-loai h2 {
            font-size: 22px;
            margin: 30px 0 12px;
        }

        .phim {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 5px 15px;
            scroll-behavior: smooth;
        }

        /* Tùy chỉnh thanh cuộn cho đẹp */
        .phim::-webkit-scrollbar {
            height: 6px;
        }
        .phim::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .phim-item {
            flex: 0 0 calc(20% - 12px);
            min-width: 180px;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
        }

        .phim-poster {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .phim-item:hover .phim-poster {
            transform: scale(1.06);
        }

        /* NHÂN VẬT */

        .danh-sach-nhan-vat {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .nhan-vat {
            flex: 0 0 auto;
            text-align: center;
        }

        .nhan-vat img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #333;
            transition: border-color 0.3s;
        }

        .nhan-vat img:hover {
            border-color: #e50914;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <ul class="danh-sach-muc">
                <li>
                    <img class="logo" src="../anh/logo.svg" alt="Netflix">
                </li>
                <li class="muc dang-chon">
                    <a class="lien-ket-muc" href="#">Trang chủ</a>
                </li>
                <li class="muc">
                    <a class="lien-ket-muc" href="#nhan-vat">Nhân vật</a>
                </li>
                <li class="muc">
                    <a class="lien-ket-muc" href="#series">Series</a>
                </li>
                <li class="muc">
                    <a class="lien-ket-muc" href="#phim">Phim</a>
                </li>
                <li class="muc">
                    <a class="lien-ket-muc" href="#moi-pho-bien">Mới & Phổ biến</a>
                </li>
            </ul>
        </nav>

        <div class="chuc-nang">
            <span>⌕</span>
            <img class="avata" src="../anh/avt.jpg" alt="Avatar">
        </div>
    </header>

    <main>

        <!-- BANNER -->

        <div class="banner" id="bannerSection">

            <img
                id="bannerImage"
                class="banner-anh"
                src="../anh/banner.jpg"
                alt="Banner"
                onclick="xemPhim('YmiU8DkUb3I')"
            >

            <iframe
                id="trailerFrame"
                class="banner-video"
                src=""
                title="Video phim"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

            <button
                id="nutQuayLai"
                class="nut-quay-lai"
                onclick="quayLaiBanner()">
                ← Quay lại
            </button>

            <div class="thong-tin-phim">
                <h1>LABRADOR</h1>
                <p>Series · Trẻ em · 2026 · 2 mùa</p>
                <p class="mo-ta">
                    Cảnh sát trưởng Labrador cùng trợ thủ phá án
                    và chia sẻ những mẹo an toàn hữu ích.
                </p>

                <div class="nut-phim">
                    <button class="nut-phat" onclick="xemPhim('YmiU8DkUb3I')">
                        ▶ Phát
                    </button>
                    <button class="nut-thong-tin" onclick="alert('Series Labrador')">
                        ⓘ Thông tin khác
                    </button>
                </div>
            </div>

        </div>

        <!-- DANH SÁCH PHIM (RENDER ĐỘNG TỪ JS) -->

        <div class="danh-sach-the-loai" id="containerPhim"></div>

        <!-- NHÂN VẬT -->

        <div class="danh-sach-the-loai" id="nhan-vat">
            <div class="ten-the-loai">
                <h2>Nhân vật nổi bật</h2>
            </div>
            <div class="danh-sach-nhan-vat" id="containerNhanVat"></div>
        </div>

    </main>

    <script>
        var danhSachTheLoai = [
            {
                idAnchor: "",
                tieuDe: "Có thể bạn chưa xem",
                danhSachPhim: [
                    { maYT: "_inKs4eeHiI", anh: "../anh/a1.jpeg" },
                    { maYT: "2Ox6aYmhxvw", anh: "../anh/a2.jpeg" },
                    { maYT: "M7aV9OE5JiY", anh: "../anh/a3.jpeg" },
                    { maYT: "c51ND9Hdbw0", anh: "../anh/a4.jpeg" },
                    { maYT: "c51ND9Hdbw0", anh: "../anh/a4.jpeg" }
                ]
            },
            {
                idAnchor: "series",
                tieuDe: "Phim hài hước & Series",
                danhSachPhim: [
                    { maYT: "dwfUi9SV5ss", anh: "../anh/b1.jpeg" },
                    { maYT: "IQZt7ElxH44", anh: "../anh/b2.jpeg" },
                    { maYT: "zKMOgOWn8lQ", anh: "../anh/b3.jpeg" },
                    { maYT: "MtZ_hf7tLxk", anh: "../anh/b4.jpeg" },
                    { maYT: "BChZi-2QAt4", anh: "../anh/b5.jpeg" }
                ]
            },
            {
                idAnchor: "phim",
                tieuDe: "Top 10 Phim chiếu rảnh",
                danhSachPhim: [
                    { maYT: "BD6PoZJdt_M", anh: "../anh/f1.jpeg" },
                    { maYT: "IosqnBOkk2I", anh: "../anh/f2.jpeg" },
                    { maYT: "IkaP0KJWTsQ", anh: "../anh/f3.jpeg" },
                    { maYT: "JpQk8f572pY", anh: "../anh/f6.jpeg" },
                    { maYT: "qW1YlO3B6Yw", anh: "../anh/f7.jpeg" }
                ]
            },
            {
                idAnchor: "moi-pho-bien",
                tieuDe: "Mới & Phổ biến",
                danhSachPhim: [
                    { maYT: "qjm1LgM2El4", anh: "../anh/g1.jpeg" },
                    { maYT: "tIqm5ByKnWQ", anh: "../anh/g3.jpeg" },
                    { maYT: "YPvmab5K0LQ", anh: "../anh/g4.jpeg" },
                    { maYT: "BLCw92vbFto", anh: "../anh/g5.jpeg" },
                    { maYT: "9ZlkNvuKTZU", anh: "../anh/g6.jpeg" }
                    
                ]
            }
        ];

        var danhSachNhanVat = [
            "../anh/q1.jpeg", "../anh/q2.jpeg", "../anh/q3.jpeg", 
            "../anh/q4.jpeg", "../anh/q5.jpeg", "../anh/q6.jpeg"
        ];

        // 2. HÀM RENDER DỮ LIỆU RA GIAO DIỆN
        function renderGiaoDien() {
            var htmlPhim = "";

            for (var i = 0; i < danhSachTheLoai.length; i++) {
                var theLoai = danhSachTheLoai[i];
                var anchorAttr = theLoai.idAnchor ? 'id="' + theLoai.idAnchor + '"' : '';

                htmlPhim += '<div class="ten-the-loai" ' + anchorAttr + '>';
                htmlPhim += '  <h2>' + theLoai.tieuDe + '</h2>';
                htmlPhim += '</div>';
                htmlPhim += '<div class="phim">';

                for (var j = 0; j < theLoai.danhSachPhim.length; j++) {
                    var phim = theLoai.danhSachPhim[j];
                    htmlPhim += '<a class="phim-item" onclick="xemPhim(\'' + phim.maYT + '\')">';
                    htmlPhim += '  <img src="' + phim.anh + '" class="phim-poster" alt="Poster">';
                    htmlPhim += '</a>';
                }

                htmlPhim += '</div>';
            }

            document.getElementById("containerPhim").innerHTML = htmlPhim;

            // Render nhân vật
            var htmlNhanVat = "";
            for (var k = 0; k < danhSachNhanVat.length; k++) {
                htmlNhanVat += '<div class="nhan-vat"><img src="' + danhSachNhanVat[k] + '"></div>';
            }
            document.getElementById("containerNhanVat").innerHTML = htmlNhanVat;
        }

        // Chạy hàm render ngay khi trang tải xong
        renderGiaoDien();

        // 3. LOGIC ĐIỀU KHIỂN VIDEO BANNER
        var bannerImage = document.getElementById("bannerImage");
        var trailerFrame = document.getElementById("trailerFrame");
        var thongTinPhim = document.getElementsByClassName("thong-tin-phim")[0];
        var nutQuayLai = document.getElementById("nutQuayLai");

        function xemPhim(maVideo) {
            var src = "https://www.youtube.com/embed/" + maVideo + "?autoplay=1";

            bannerImage.style.display = "none";
            trailerFrame.style.display = "block";
            thongTinPhim.style.display = "none";
            nutQuayLai.style.display = "block";

            trailerFrame.src = src;

            // Cuộn mượt lên vị trí Banner để người dùng xem video
            document.getElementById("bannerSection").scrollIntoView({ behavior: 'smooth' });
        }

        function quayLaiBanner() {
            trailerFrame.src = "";
            trailerFrame.style.display = "none";

            bannerImage.style.display = "block";
            thongTinPhim.style.display = "block";
            nutQuayLai.style.display = "none";
        }
    </script>

</body>
</html>
